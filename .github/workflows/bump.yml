name: Bump

on:
  workflow_dispatch:
    inputs:
      level:
        description: "Bump level (patch / minor / major / explicit x.y.z)"
        required: true
        type: string
        default: "patch"
      dry_run:
        description: "Prepare locally in the runner without pushing or opening a pull request"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  bump:
    name: Prepare a release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: "1.89.0"

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: bump

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Run release preparation
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LEVEL: ${{ inputs.level }}
          DRY_RUN: ${{ inputs.dry_run }}
        shell: bash
        run: |
          if [[ "$DRY_RUN" == "true" ]]; then
            cargo xtask release-prep "$LEVEL" --dry-run
          else
            cargo xtask release-prep "$LEVEL"
          fi
