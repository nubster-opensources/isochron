[package]
name = "isochron"
version = "0.1.2"
edition = "2024"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
description = "A pure, deterministic cron occurrence engine on time: parse Vixie-standard cron expressions and compute next and previous occurrences in strict UTC."
readme = "README.md"
repository = "https://github.com/nubster-opensources/isochron"
homepage = "https://nubster.com"
authors = ["Nubster"]
keywords = ["cron", "schedule", "time", "recurrence"]
categories = ["date-and-time"]

# The release type the public API comparison applies until the next release. `patch` lets
# `cargo semver-checks` infer it from the version above; `minor` or `major` is the reviewed
# permission for an intentional breaking change, and `cargo xtask release-prep` then refuses
# to bump less than what is declared here.
[package.metadata.isochron]
next-release = "minor"

[package.metadata.docs.rs]
all-features = true
targets = ["x86_64-unknown-linux-gnu"]
# `doc_cfg` marks which items a feature gates. It is a nightly attribute, enabled only
# under this flag, so no user build and no continuous integration job ever sees it.
rustdoc-args = ["--cfg", "docsrs"]

[features]
# Serde support, off by default: the default dependency graph must stay unchanged.
serde = ["dep:serde"]

[dependencies]
time = { version = "0.3", features = ["macros"] }
thiserror = "2"
# `alloc` alone, never `std`: the canonical expression needs a `String` and nothing more,
# and refusing `std` here keeps the door open for the planned no_std support.
serde = { version = "1", optional = true, default-features = false, features = ["alloc"] }

[dev-dependencies]
serde_json = "1"
# A binary format that is not self-describing, which is what the round trip must exercise.
postcard = { version = "1", features = ["alloc"] }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"
unreachable_pub = "warn"
rust_2024_compatibility = { level = "warn", priority = -1 }

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
similar_names = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

[workspace]
members = ["xtask"]
