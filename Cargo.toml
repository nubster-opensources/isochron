[package]
name = "isochron"
version = "0.1.2"
edition = "2024"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
description = "A pure, deterministic cron occurrence engine on time: parse Vixie-standard cron expressions and compute next and previous occurrences in strict UTC."
readme = "README.md"
repository = "https://github.com/nubster-opensources/isochron"
homepage = "https://nubster.com"
authors = ["Nubster"]
keywords = ["cron", "schedule", "time", "recurrence"]
categories = ["date-and-time"]

# The release type the public API comparison applies until the next release. `patch` lets
# `cargo semver-checks` infer it from the version above; `minor` or `major` is the reviewed
# permission for an intentional breaking change, and `cargo xtask release-prep` then refuses
# to bump less than what is declared here.
[package.metadata.isochron]
next-release = "patch"

[package.metadata.docs.rs]
all-features = true
targets = ["x86_64-unknown-linux-gnu"]

[dependencies]
time = { version = "0.3", features = ["macros"] }
thiserror = "2"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"
unreachable_pub = "warn"
rust_2024_compatibility = { level = "warn", priority = -1 }

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
similar_names = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

[workspace]
members = ["xtask"]
